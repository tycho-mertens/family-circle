plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.familycirclebridge'
version = '0.1.0'

android {
  namespace "expo.modules.familycirclebridge"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  testOptions { unitTests.returnDefaultValues = true }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  testImplementation "junit:junit:4.13.2"
  testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
  implementation 'androidx.work:work-runtime-ktx:2.10.1'

  implementation "com.microsoft.signalr:signalr:9.0.20"
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
  // UniFFI loads libcrypto_core.so through JNA. Version 5.17.0 supplies
  // 16 KB-page-aligned native binaries for Android, including x86_64 emulators.
  implementation "net.java.dev.jna:jna:5.17.0@aar"

  // Android notification channels and local message alerts.
  implementation "androidx.core:core-ktx:1.13.1"

  // Headless JS task APIs; the React Native Gradle plugin supplies the version.
  implementation "com.facebook.react:react-android"
}
